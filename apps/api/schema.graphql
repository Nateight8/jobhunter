"""
A reusable answer to a question that recurs in application forms. Empty means never guessed.
"""
type Answer {
  answer: String
  answerType: AnswerType!
  id: ID!

  """Set for starter questions, null for your own"""
  key: String
  question: String!
}

input AnswerInput {
  answer: String
  answerType: AnswerType!
  key: String
  question: String!
}

enum AnswerType {
  TEXT
  YES_NO
}

"""
The profile's own state for one job. Personal data: it never touches the public jobs table.
"""
type Application {
  appliedAt: String
  id: ID!
  job: Job!
  notes: String
  status: ApplicationStatus!
  updatedAt: String!
}

type ApplicationCount {
  count: Int!
  status: ApplicationStatus!
}

enum ApplicationStatus {
  APPLIED
  HIDDEN
  INTERVIEWING
  OFFER
  REJECTED
  SAVED
}

type Board {
  """
  Computed on request, so ask for it in a separate query from the board list.
  """
  count: BoardCount!
  filter: BoardFilter!
  id: ID!

  """recommended, or null for your own boards"""
  kind: String
  name: String!
  position: Int!
}

"""Number of matching jobs, capped (value 500 + capped true means 500+)."""
type BoardCount {
  capped: Boolean!
  value: Int!
}

type BoardFilter {
  regions: [String!]
  remoteTypes: [RemoteType!]
  search: String
  sources: [String!]
  stack: [String!]
  startupMaxBoardSize: Int
  startupOnly: Boolean
  titleExcludes: [String!]
  titleIncludes: [String!]
}

input BoardFilterInput {
  regions: [String!]
  remoteTypes: [RemoteType!]
  search: String
  sources: [String!]
  stack: [String!]
  startupMaxBoardSize: Int
  startupOnly: Boolean
  titleExcludes: [String!]
  titleIncludes: [String!]
}

type BoardPreset {
  description: String!
  filter: BoardFilter!
  id: ID!
  name: String!
}

"""The full reviewed profile. Every list replaces what is stored."""
input ConfirmProfileInput {
  education: [EducationInput!]!
  experiences: [ExperienceInput!]!
  profile: ProfileInput!
  projects: [ProjectInput!]!
  skills: [SkillInput!]!
}

"""
File metadata. Bytes are served from the downloadUrl, never through GraphQL.
"""
type Document {
  createdAt: String!
  downloadUrl: String!
  filename: String!
  id: ID!
  isDefault: Boolean!
  kind: DocumentKind!
  mimeType: String!
  sizeBytes: Int!
}

enum DocumentKind {
  COVER_LETTER
  CV
  OTHER
}

type DraftEducation {
  degree: String
  endDate: String
  field: String
  school: String!
  startDate: String
}

type DraftExperience {
  bullets: [String!]!
  company: String!
  endDate: String
  isCurrent: Boolean!
  location: String
  startDate: String
  technologies: [String!]!
  title: String!
}

"""
What the model read from the CV. Reviewed by the user before anything is saved.
"""
type DraftProfile {
  city: String
  country: String
  education: [DraftEducation!]!
  email: String
  experiences: [DraftExperience!]!
  fullName: String
  githubUrl: String
  headline: String
  linkedinUrl: String
  otherLinks: [ProfileLink!]!
  phone: String
  portfolioUrl: String
  projects: [DraftProject!]!
  skills: [DraftSkill!]!
  summary: String
}

type DraftProject {
  bullets: [String!]!
  description: String
  name: String!
  technologies: [String!]!
  url: String
}

type DraftSkill {
  category: String
  name: String!
}

type Education {
  degree: String
  endDate: String
  field: String
  id: ID!
  school: String!
  startDate: String
}

input EducationInput {
  degree: String
  endDate: String
  field: String
  school: String!
  startDate: String
}

type Experience {
  bullets: [String!]!
  company: String!
  endDate: String
  id: ID!
  isCurrent: Boolean!
  location: String
  startDate: String
  technologies: [String!]!
  title: String!
}

"""Dates look like 2024-05. Ignored endDate when isCurrent is true."""
input ExperienceInput {
  bullets: [String!]
  company: String!
  endDate: String
  isCurrent: Boolean
  location: String
  startDate: String
  technologies: [String!]
  title: String!
}

type Job {
  """
  Full application record. One query per job, so request it on a single job, not in lists.
  """
  application: Application
  applicationStatus: ApplicationStatus
  applyUrl: String
  boardSize: Int
  closedAt: String
  companyName: String!

  """Raw HTML. Loaded on demand, so avoid requesting it in lists."""
  description: String
  firstSeenAt: String!
  id: ID!
  location: String
  postedAt: String
  remoteType: RemoteType!
  score: Int
  source: String!
  status: String!
  title: String!
  url: String!
}

type JobConnection {
  edges: [JobEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type JobEdge {
  cursor: String!
  node: Job!
}

input JobFilter {
  includeClosed: Boolean

  """Also show jobs you have applied to or hidden"""
  includeTracked: Boolean

  """
  Region codes (see regionOptions). Any match; jobs with no region are left out.
  """
  regions: [String!]
  remoteTypes: [RemoteType!]

  """Matches job title or company name"""
  search: String
  sources: [String!]

  """Keywords, any match, e.g. ["node", "react"]"""
  stack: [String!]

  """Default 50 open jobs"""
  startupMaxBoardSize: Int

  """Only jobs from ATS boards under the size limit"""
  startupOnly: Boolean

  """Title must contain none of these words"""
  titleExcludes: [String!]

  """Title must contain any of these words"""
  titleIncludes: [String!]
}

type Mutation {
  """
  Saves the reviewed profile in one transaction, computes years of experience from the experience dates and marks the draft confirmed. Requires name, email, phone, country and at least one authorized region. The first confirmation also creates the Recommended board.
  """
  confirmProfile(draftId: ID, input: ConfirmProfileInput!): Profile!
  createBoard(filter: BoardFilterInput, name: String!): Board!

  """Returns the remaining boards."""
  deleteBoard(id: ID!): [Board!]!

  """
  Deletes a document. If it was the default, the newest one of its kind takes over.
  """
  deleteDocument(id: ID!): Profile!
  discardDraft(id: ID!): Profile!

  """
  Reads a stored CV with Gemini and saves the result as a draft (see Profile.draft). Takes a few seconds. A failed extraction leaves a draft with status failed and an error message.
  """
  extractProfile(documentId: ID!): Profile!

  """
  Forgets the profile's state for a job (unsave, restore, undo). Returns the job.
  """
  removeApplication(jobId: ID!): Job!

  """Takes every board id in the new order."""
  reorderBoards(ids: [ID!]!): [Board!]!

  """
  Regenerates the Recommended board from the CV, or creates it if it is missing.
  """
  resetRecommendedBoard: Board!

  """
  Replaces the whole bank in one transaction. Starters you leave out come back empty.
  """
  saveAnswers(items: [AnswerInput!]!): [Answer!]!

  """Replaces the whole education list."""
  saveEducation(items: [EducationInput!]!): Profile!

  """Replaces the whole experience list; order = array order."""
  saveExperiences(items: [ExperienceInput!]!): Profile!

  """Partial update: omitted fields stay, null clears."""
  saveProfile(input: ProfileInput!): Profile!

  """Replaces the whole project list."""
  saveProjects(items: [ProjectInput!]!): Profile!

  """Replaces the whole skill list. Duplicate names are dropped."""
  saveSkills(items: [SkillInput!]!): Profile!
  setApplicationNotes(jobId: ID!, notes: String): Application!

  """
  Saves, hides or records progress on a job. Creates the record if needed. Moving to applied (or later) stamps the applied date once.
  """
  setApplicationStatus(jobId: ID!, notes: String, status: ApplicationStatus!): Application!

  """Makes this document the default for its kind."""
  setDefaultDocument(id: ID!): Profile!

  """
  Renames and/or replaces the filter. Omitted arguments stay as they are.
  """
  updateBoard(filter: BoardFilterInput, id: ID!, name: String): Board!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type Profile {
  authorizedRegions: [String!]!
  city: String
  confirmedAt: String
  country: String
  documents: [Document!]!

  """The live CV-extraction draft, if any."""
  draft: ProfileDraft
  education: [Education!]!
  email: String
  experiences: [Experience!]!
  fullName: String
  githubUrl: String
  headline: String
  id: ID!
  linkedinUrl: String
  links: [ProfileLink!]!
  phone: String
  portfolioUrl: String
  projects: [Project!]!
  readiness: ProfileReadiness!
  skills: [Skill!]!
  summary: String
  timezone: String
  yearsExperience: Int
}

type ProfileDraft {
  createdAt: String!
  data: DraftProfile
  documentId: ID
  error: String
  id: ID!
  model: String

  """pending, ready or failed"""
  status: String!
}

input ProfileInput {
  authorizedRegions: [String!]
  city: String
  country: String
  email: String
  fullName: String
  githubUrl: String
  headline: String
  linkedinUrl: String
  links: [ProfileLinkInput!]
  phone: String
  portfolioUrl: String
  summary: String
  timezone: String
  yearsExperience: Int
}

type ProfileLink {
  label: String!
  url: String!
}

input ProfileLinkInput {
  label: String!
  url: String!
}

"""
missing holds any of: fullName, email, phone, country, authorizedRegions, cv
"""
type ProfileReadiness {
  missing: [String!]!
  ready: Boolean!
}

type Project {
  bullets: [String!]!
  description: String
  id: ID!
  name: String!
  technologies: [String!]!
  url: String
}

input ProjectInput {
  bullets: [String!]
  description: String
  name: String!
  technologies: [String!]
  url: String
}

type Query {
  """The answers bank. Starter questions are created on first read."""
  answers: [Answer!]!
  applicationCounts: [ApplicationCount!]!

  """Newest activity first. Omit status for all."""
  applications(status: ApplicationStatus): [Application!]!
  boardPresets: [BoardPreset!]!

  """
  The profile's boards in tab order. All is not a board: it is the feed with no board.
  """
  boards: [Board!]!
  job(id: ID!): Job
  jobs(after: String, filter: JobFilter, first: Int = 25): JobConnection!

  """The single local profile. Created empty on first read."""
  profile: Profile!
  regionOptions: [RegionOption!]!
}

"""
A region at least one open job is placed in. Options come from the data.
"""
type RegionOption {
  code: String!
  count: Int!
  name: String!
}

enum RemoteType {
  HYBRID
  ONSITE
  REMOTE
  UNKNOWN
}

type Skill {
  category: String
  id: ID!
  name: String!
}

input SkillInput {
  category: String
  name: String!
}
